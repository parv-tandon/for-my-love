<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Love 💌</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Dancing+Script:wght@400;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            overflow-x: hidden;
        }
        .handwriting {
            font-family: 'Dancing Script', cursive;
        }
        .serif {
            font-family: 'Cormorant Garamond', serif;
        }

        /* Twinkling stars background */
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.7); }
            50% { opacity: 1; transform: scale(1.3); }
        }
        @keyframes drift {
            0% { transform: translateY(0); }
            100% { transform: translateY(-30px); }
        }
        @keyframes glitter {
            0%, 100% { opacity: 0; transform: scale(0.4); }
            50% { opacity: 0.9; transform: scale(1); }
        }
        .star {
            position: fixed;
            border-radius: 9999px;
            background: #f5d9a8;
            animation: twinkle ease-in-out infinite, drift linear infinite;
            pointer-events: none;
            z-index: 0;
        }
        .glitter {
            position: fixed;
            border-radius: 9999px;
            animation: glitter ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        /* Galaxy nebula clouds */
        .nebula {
            position: fixed;
            border-radius: 9999px;
            filter: blur(60px);
            mix-blend-mode: screen;
            pointer-events: none;
            z-index: 0;
        }

        /* Shooting stars */
        @keyframes shoot {
            0% { transform: translate(0, 0) rotate(-35deg); opacity: 1; }
            70% { opacity: 1; }
            100% { transform: translate(-500px, 350px) rotate(-35deg); opacity: 0; }
        }
        .shooting-star {
            position: fixed;
            top: 0;
            width: 2px;
            height: 2px;
            background: linear-gradient(-35deg, rgba(255,255,255,0), #fff 60%, #fff);
            border-radius: 999px;
            box-shadow: 0 0 0 1px rgba(255,255,255,0.1);
            z-index: 0;
            pointer-events: none;
        }
        .shooting-star::before {
            content: '';
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 120px;
            height: 1px;
            background: linear-gradient(90deg, #fff, transparent);
        }

        /* Timeline */
        .timeline-line {
            background: linear-gradient(to bottom, transparent, #d4af7a 5%, #f5d9a8 50%, #d4af7a 95%, transparent);
        }
        .timeline-card {
            opacity: 0;
            transform: translateY(20px);
            animation: riseIn 0.7s ease-out forwards;
        }
        @keyframes riseIn {
            to { opacity: 1; transform: translateY(0); }
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(212, 175, 122, 0.25);
        }
        .glass-card:hover {
            border-color: rgba(245, 217, 168, 0.6);
        }

        /* Page transition overlay (circular reveal into the next page) */
        .page-transition-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            pointer-events: none;
            clip-path: circle(0% at var(--x, 50%) var(--y, 50%));
            transition: clip-path 0.7s cubic-bezier(.65, 0, .35, 1);
        }
        .page-transition-overlay.active {
            clip-path: circle(150% at var(--x, 50%) var(--y, 50%));
        }
        @media (prefers-reduced-motion: reduce) {
            .page-transition-overlay { transition: none; }
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #d4af7a; border-radius: 4px; }

        /* Planets */
        @keyframes orbit {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .planet-wrap {
            position: absolute;
            z-index: 1;
        }
        .orbit-pivot {
            position: absolute;
            top: 0;
            left: 0;
            width: 1px;
            height: 1px;
            animation-name: orbit;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }
        .orbit-offset {
            position: absolute;
            top: 0;
            left: 0;
        }
        .orbit-counter {
            animation-name: orbit;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }
        .planet {
            display: inline-block;
            line-height: 1;
            cursor: pointer;
            transition: transform 0.45s ease;
        }
        .planet-wrap:hover .planet {
            transform: scale(1.35) rotate(8deg);
        }
        .planet-photo {
            position: absolute;
            top: 0;
            left: 0;
            width: 160px;
            transform: translate(-50%, -50%) scale(0.55);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.45s ease, transform 0.45s ease;
            z-index: 5;
            text-align: center;
        }
        .planet-wrap:hover .planet-photo {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        .planet-photo img {
            display: block;
            width: 160px !important;
            height: 160px !important;
            max-width: none;
            object-fit: cover;
            border-radius: 9999px;
            border: 3px solid rgba(245, 217, 168, 0.6);
            box-shadow: 0 0 40px rgba(245, 217, 168, 0.35), 0 0 0 8px rgba(11, 17, 32, 0.6);
        }
    </style>
</head>
<body class="bg-gradient-to-b from-[#0b1120] via-[#131c31] to-[#0b1120] min-h-screen relative text-slate-200">

    <!-- Galaxy Nebula Clouds -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
        <div class="nebula w-[28rem] h-[28rem] -top-32 -left-24 bg-indigo-500/25"></div>
        <div class="nebula w-96 h-96 top-1/3 -right-16 bg-fuchsia-500/15"></div>
        <div class="nebula w-[26rem] h-[26rem] bottom-0 left-1/4 bg-sky-400/15"></div>
        <div class="nebula w-72 h-72 top-2/3 right-1/4 bg-violet-400/10"></div>
    </div>

    <!-- Starfield Background -->
    <div id="stars-container" class="fixed inset-0 pointer-events-none overflow-hidden z-0"></div>

    <!-- Planets -->
    <div id="planets-container" class="absolute inset-0 z-0 overflow-hidden"></div>

    <div class="relative z-10 max-w-3xl mx-auto px-4 pt-16 pb-24">

        <!-- Header -->
        <header class="text-center mb-16">
            <p class="text-amber-200/70 font-semibold tracking-[0.3em] text-xs uppercase mb-4">Our Story, Always Growing</p>
            <h1 class="handwriting text-5xl md:text-6xl text-amber-100 font-bold mb-4" style="text-shadow: 0 0 30px rgba(245,217,168,0.25);">For My Love</h1>
            <p class="serif text-lg text-slate-400 max-w-md mx-auto italic">Every celebration orbits around one thing: you. Tap a memory below and let's relive it together, my love.</p>
        </header>

        <!-- Timeline -->
        <div class="relative">
            <div class="timeline-line absolute left-6 md:left-8 top-0 bottom-0 w-px rounded-full"></div>
            <div id="timeline" class="space-y-10"></div>
        </div>

        <!-- Footer -->
        <footer class="text-center mt-20 text-sm text-slate-500">
            <p class="handwriting text-2xl text-amber-100 mb-1">Made with all my love,</p>
            <p>Parv 🤍</p>
        </footer>
    </div>

    <script>
        // --- Twinkling Starfield ---
        const STAR_COLORS = ['#ffffff', '#f5d9a8', '#c7d2fe', '#fbcfe8'];

        function createStar() {
            const star = document.createElement('div');
            star.classList.add('star');
            const size = Math.random() * 2.5 + 1.5;
            const color = STAR_COLORS[Math.floor(Math.random() * STAR_COLORS.length)];
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + 'vw';
            star.style.top = Math.random() * 100 + 'vh';
            star.style.background = color;
            star.style.boxShadow = `0 0 ${size * 2.5}px ${size * 0.8}px ${color}`;
            star.style.animationDuration = (Math.random() * 3 + 2) + 's, ' + (Math.random() * 20 + 20) + 's';
            document.getElementById('stars-container').appendChild(star);
        }
        for (let i = 0; i < 130; i++) createStar();

        // --- Fine Glitter Dust ---
        function createGlitter() {
            const dot = document.createElement('div');
            dot.classList.add('glitter');
            const size = Math.random() * 1.2 + 0.4;
            const color = STAR_COLORS[Math.floor(Math.random() * STAR_COLORS.length)];
            dot.style.width = size + 'px';
            dot.style.height = size + 'px';
            dot.style.left = Math.random() * 100 + 'vw';
            dot.style.top = Math.random() * 100 + 'vh';
            dot.style.background = color;
            dot.style.boxShadow = `0 0 ${size * 3}px ${color}`;
            dot.style.animationDuration = (Math.random() * 2 + 1) + 's';
            dot.style.animationDelay = (Math.random() * 3) + 's';
            document.getElementById('stars-container').appendChild(dot);
        }
        for (let i = 0; i < 160; i++) createGlitter();

        // --- Occasional Shooting Stars ---
        function createShootingStar() {
            const star = document.createElement('div');
            star.classList.add('shooting-star');
            star.style.left = (Math.random() * 60 + 30) + 'vw';
            star.style.top = (Math.random() * 30) + 'vh';
            star.style.animation = `shoot ${Math.random() * 0.6 + 1}s ease-in forwards`;
            document.getElementById('stars-container').appendChild(star);
            setTimeout(() => star.remove(), 2000);
        }
        setInterval(createShootingStar, 4500);

        // --- Planets & celestial bodies (emoji icons) ---
        const planets = [
            { name: 'Sun', emoji: '☀️', size: 44, left: '9vw', glow: 'rgba(255,200,80,0.9)', photo: 'home/03026b36-52b1-43ee-be18-c91aa395477c.JPG' },
            { name: 'Moon', emoji: '🌙', size: 36, left: '85vw', glow: 'rgba(220,225,235,0.85)', photo: 'home/28cb92bd-5306-4788-b17b-ad323b730d9d.JPG' },
            { name: 'Earth', emoji: '🌍', size: 46, left: '7vw', glow: 'rgba(95,175,230,0.85)', photo: 'home/446e8fc6-3a18-4872-a8d7-4aa7708ef7d4.JPG' },
            { name: 'Star', emoji: '🌟', size: 34, left: '88vw', glow: 'rgba(255,235,180,0.9)', photo: 'home/4ca3a0c4-707a-46bf-8981-a0a85e4ef23c.JPG' },
            { name: 'Our Journey', emoji: '🚀', size: 44, left: '11vw', glow: 'rgba(255,150,90,0.85)', photo: 'home/93e25ce4-f2e7-4c5c-a85a-b49fe89376c3.JPG' },
            { name: 'Saturn', emoji: '🪐', size: 56, left: '82vw', glow: 'rgba(235,210,150,0.85)', photo: 'home/d2346b27-1ac8-4b98-b916-856532c7cae8.JPG' }
        ];

        // Keeps planets clear of the header and footer margins by confining
        // them to the vertical band between the two, however tall the page is.
        function renderPlanets() {
            const container = document.getElementById('planets-container');
            const header = document.querySelector('header');
            const footer = document.querySelector('footer');
            const margin = 32;
            const startY = header.offsetTop + header.offsetHeight + margin;
            const endY = Math.max(footer.offsetTop - margin, startY + 100);
            const span = endY - startY;
            const slot = span / planets.length;

            container.innerHTML = planets.map((p, i) => {
                const duration = (16 + Math.random() * 14).toFixed(1);
                const direction = Math.random() < 0.5 ? 'normal' : 'reverse';
                const counterDirection = direction === 'normal' ? 'reverse' : 'normal';
                const radius = 16 + Math.round(Math.random() * 22);
                const delay = (Math.random() * -duration).toFixed(1);
                const jitter = (Math.random() - 0.5) * slot * 0.4;
                const topPx = Math.round(startY + slot * (i + 0.5) + jitter);
                return `
                <div class="planet-wrap" style="top:${topPx}px; left:${p.left};">
                    <div class="orbit-pivot" style="animation-duration:${duration}s; animation-direction:${direction}; animation-delay:${delay}s;">
                        <div class="orbit-offset" style="transform: translate(${radius}px, 0);">
                            <div class="orbit-counter" style="animation-duration:${duration}s; animation-direction:${counterDirection}; animation-delay:${delay}s;">
                                <span class="planet" style="font-size:${p.size}px; filter: drop-shadow(0 0 ${p.size * 0.35}px ${p.glow});">${p.emoji}</span>
                            </div>
                        </div>
                    </div>
                    <div class="planet-photo">
                        <img src="${p.photo}" alt="${p.name}">
                    </div>
                </div>
            `;
            }).join('');
        }

        // --- Events Data ---
        // Add a new object here whenever a new event/page is ready.
        // date format: YYYY-MM-DD — the actual date that event happened/happens.
        const events = [
            {
                icon: '🎂',
                title: 'Her Birthday',
                description: 'The day the most beautiful soul in my life was born.',
                date: '2025-11-23',
                link: 'birthday/index.html',
                color: 'linear-gradient(135deg, #fce7f3 0%, #fda4c0 55%, #f472b6 100%)'
            },
            {
                icon: '💐',
                title: "Girlfriend's Day",
                description: 'A whole day dedicated to celebrating my favorite person.',
                date: '2026-08-01',
                link: 'girlfriends-day/index.html',
                color: 'linear-gradient(135deg, #d8b98a 0%, #a9743f 55%, #6b4226 100%)'
            }
        ];

        function formatDate(dateStr) {
            const [y, m, d] = dateStr.split('-').map(Number);
            const date = new Date(y, m - 1, d);
            return date.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
        }

        function countdownLabel(dateStr) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const [y, m, d] = dateStr.split('-').map(Number);
            const target = new Date(y, m - 1, d);
            target.setHours(0, 0, 0, 0);

            const diffDays = Math.round((target - today) / 86400000);

            if (diffDays === 0) return "✨ Today!";
            if (diffDays > 0) return `${diffDays} day${diffDays === 1 ? '' : 's'} to go`;
            return `${Math.abs(diffDays)} day${Math.abs(diffDays) === 1 ? '' : 's'} ago`;
        }

        function renderTimeline() {
            const container = document.getElementById('timeline');
            container.innerHTML = events.map((ev, i) => `
                <div class="relative pl-16 md:pl-20 timeline-card" style="animation-delay:${i * 150}ms">
                    <div class="absolute left-0 md:left-2 top-0 w-12 h-12 rounded-full bg-gradient-to-br from-amber-200 to-amber-500 flex items-center justify-center text-2xl shadow-lg ring-4 ring-[#0b1120]">
                        ${ev.icon}
                    </div>
                    <a href="${ev.link}" data-color="${ev.color}" class="event-link glass-card block rounded-2xl shadow-lg p-6 transition transform hover:-translate-y-1">
                        <div class="flex justify-between items-start flex-wrap gap-2">
                            <h3 class="text-2xl font-bold handwriting text-amber-100">${ev.title}</h3>
                            <span class="text-xs font-semibold bg-amber-400/10 text-amber-200 border border-amber-300/30 px-3 py-1 rounded-full whitespace-nowrap">${countdownLabel(ev.date)}</span>
                        </div>
                        <p class="serif text-slate-300 text-lg mt-2 italic">${ev.description}</p>
                        <p class="text-sm text-slate-500 mt-3">📅 ${formatDate(ev.date)}</p>
                    </a>
                </div>
            `).join('');
        }

        renderTimeline();
        renderPlanets();

        // --- Themed page transition on navigating to an event page ---
        document.getElementById('timeline').addEventListener('click', (e) => {
            const link = e.target.closest('a.event-link');
            if (!link) return;
            // Let modified clicks (new tab, etc.) behave normally.
            if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return;
            e.preventDefault();

            const href = link.getAttribute('href');
            const rect = link.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;

            const overlay = document.createElement('div');
            overlay.className = 'page-transition-overlay';
            overlay.style.background = link.dataset.color || '#0b1120';
            overlay.style.setProperty('--x', x + 'px');
            overlay.style.setProperty('--y', y + 'px');
            document.body.appendChild(overlay);

            const go = () => { window.location.href = href; };
            overlay.addEventListener('transitionend', go, { once: true });
            setTimeout(go, 800); // fallback in case transitionend doesn't fire

            requestAnimationFrame(() => requestAnimationFrame(() => {
                overlay.classList.add('active');
            }));
        });

        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(renderPlanets, 200);
        });
    </script>
</body>
</html>
